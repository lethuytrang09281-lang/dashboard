<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS // Sales Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-body: #09090b;
        --sidebar-bg: #111113;
        --card-bg: #18181b;
        --card-border: #27272a;
        
        /* Accents */
        --primary: #ff5f1f; /* Orange */
        --primary-glow: rgba(255, 95, 31, 0.15);
        
        /* Success (Gray - Professional) */
        --success: #989FA6; 
        --success-glow: rgba(152, 159, 166, 0.15);
        
        --danger: #ef4444;
        
        /* Text */
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --text-dark: #52525b;

        --font-sans: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    /* Hide Scrollbar */
    ::-webkit-scrollbar { display: none; }
    
    body {
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: var(--font-sans);
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        perspective: 1200px;
    }

    .scroll-area {
        padding: 30px;
        overflow-y: auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        max-width: 1600px; /* Optimal width for wide screens */
        margin: 0 auto;
        width: 100%;
        transform-style: preserve-3d;
        scrollbar-width: none;
    }

    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 24px;
        flex-shrink: 0;
    }

    .controls-top { display: flex; gap: 12px; align-items: center; }

    .icon-btn {
        width: 36px; height: 36px;
        border-radius: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        display: flex; align-items: center; justify-content: center;
        color: var(--text-muted);
        cursor: pointer; transition: 0.2s;
    }
    .icon-btn:hover { border-color: var(--text-muted); color: #fff; }

    /* --- LAYOUT (STYLE Q) --- */
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; 
        grid-auto-rows: min-content; 
        gap: 20px;
        padding-bottom: 40px;
        flex: 1;
        transform-style: preserve-3d; 
    }

    /* 1. Hero Card: Full Width */
    .card-hero { 
        grid-column: 1 / -1; 
        height: 170px; 
    } 
    
    /* 2. KPI Cards: Split Width */
    .card-kpi-1 { 
        grid-column: span 1; 
        height: 230px; 
    }
    .card-kpi-2 { 
        grid-column: span 1; 
        height: 230px;
    }

    /* 3. Chart: Full Width */
    .card-chart {
        grid-column: 1 / -1;
        height: 350px;
    }

    /* 4. List: Full Width */
    .card-list {
        grid-column: 1 / -1;
        min-height: 400px;
    }

    /* Cards Styling */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 24px;
        position: relative;
        overflow: hidden;
        display: flex; flex-direction: column;
        
        box-shadow: 
            0 10px 30px rgba(0,0,0,0.5),
            0 0 0 1px rgba(255,255,255,0.05),
            0 0 20px rgba(255,255,255,0.02);
        
        transition: transform 0.1s linear, box-shadow 0.3s ease; 
        transform-style: preserve-3d;
        will-change: transform;
    }
    
    .card:hover {
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1), 0 0 30px rgba(255,255,255,0.05);
    }

    .card-header {
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-bottom: 16px;
        z-index: 2;
    }
    .card-title { font-size: 13px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

    .card-hero { background: linear-gradient(135deg, #1e1e24 0%, #111 100%); }
    
    .hero-stat {
        font-size: clamp(48px, 5vw, 64px); 
        font-weight: 700; color: #fff;
        margin: auto 0;
        letter-spacing: -1.5px; line-height: 1;
        z-index: 2;
    }

    /* Progress bars */
    .progress-track {
        height: 6px; width: 100%; background: #27272a;
        border-radius: 3px; overflow: hidden; margin-top: auto;
    }
    .progress-fill {
        height: 100%; background: var(--primary);
        width: 0%; transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 12px var(--primary);
    }

    /* List Card */
    .card-list { padding: 0; }
    .list-header { padding: 20px 20px 10px 20px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); flex-shrink: 0; }
    .list-scroll { padding: 0 10px 20px 20px; overflow: visible; flex: 1; }
    
    .list-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .rank-badge {
        width: 24px; height: 24px; border-radius: 6px;
        background: #27272a; color: #777;
        font-size: 11px; font-weight: 700; font-family: var(--font-mono);
        display: flex; align-items: center; justify-content: center;
    }
    .rank-1 { background: var(--success); color: #000; box-shadow: 0 0 10px var(--success-glow); }
    .rank-2 { background: #e0e0e0; color: #000; }
    .rank-3 { background: #cd7f32; color: #000; }

    /* Chart Card */
    .card-chart { padding-bottom: 10px; }
    .chart-container { flex: 1; width: 100%; display: flex; align-items: flex-end; gap: 8px; padding-top: 20px; border-bottom: 1px solid #333; }
    
    .chart-col {
        flex: 1; height: 100%; 
        display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        position: relative; group: hover;
    }
    .chart-bar {
        width: 80%; max-width: 50px; border-radius: 4px 4px 0 0;
        background-image: linear-gradient(to top, rgba(255,255,255,0.05), currentColor);
        height: 0%;
        transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative; min-height: 4px;
    }
    .chart-col:hover .chart-bar::after {
        content: attr(data-tooltip);
        position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        background: #fff; color: #000; padding: 4px 8px; border-radius: 4px;
        font-size: 10px; font-weight: 700; white-space: nowrap; margin-bottom: 8px;
        z-index: 10; pointer-events: none;
    }

    /* SVG Donut Chart */
    .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 160px; }
    .circle-bg { fill: none; stroke: #27272a; stroke-width: 4; }
    .circle { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray 1.5s ease-out; }
    .percentage { fill: #fff; font-family: var(--font-sans); font-weight: bold; font-size: 0.6em; text-anchor: middle; }
    
    /* Overlays */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
        z-index: 999; display: none; align-items: center; justify-content: center;
    }
    .modal-box {
        background: #18181b; border: 1px solid #333;
        padding: 24px; border-radius: 16px; width: 90%; max-width: 450px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Typography helpers */
    .text-sm { font-size: 11px; color: var(--text-muted); }
    .text-mono { font-family: var(--font-mono); }
    .flex-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge-success { background: var(--success-glow); color: var(--success); }
    .badge-warn { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .btn-main {
        background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px;
        font-weight: 600; cursor: pointer; font-size: 13px; box-shadow: 0 0 15px var(--primary-glow); white-space: nowrap;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1024px) {
        .dashboard-grid { grid-template-columns: 1fr; }
        .card-hero, .card-kpi-1, .card-kpi-2, .card-chart, .card-list { grid-column: span 1; }
    }
</style>
</head>
<body>

    <!-- OVERLAYS -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <h3 style="color: #fff; margin-bottom: 15px; font-weight: 500;">Источник данных</h3>
            <p style="font-size: 13px; color: #888; margin-bottom: 15px; line-height: 1.5;">
                Вставьте ссылку на CSV (Google Sheets -> Файл -> Поделиться -> Опубликовать в интернете -> CSV).
            </p>
            <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/.../pub?output=csv" 
                   style="width: 100%; background: #111; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 8px; margin-bottom: 20px; font-family: var(--font-mono); font-size: 12px;">
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeModal()" style="background: transparent; border: 1px solid #444; color: #aaa; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Закрыть</button>
                <button onclick="saveSettings()" class="btn-main" style="box-shadow: none;">Сохранить</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <button onclick="resetToDemo()" style="color: #555; background: none; border: none; font-size: 11px; cursor: pointer; text-decoration: underline;">Сброс Demo</button>
            </div>
        </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-content">
        <div class="scroll-area">
            
            <!-- TOP NAV -->
            <div class="top-bar">
                <div style="display: flex; align-items: center;">
                    <div style="margin-right: 15px; width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; box-shadow: 0 0 15px var(--primary-glow);">N</div>
                    <div>
                        <h1 style="font-size: 18px; font-weight: 600; letter-spacing: -0.5px;">Sales Dashboard</h1>
                        <div style="font-size: 11px; color: var(--text-dark); margin-top: 2px;">Sync: <span id="last-update" class="text-mono">--:--</span></div>
                    </div>
                </div>
                <div class="controls-top">
                    <button class="icon-btn" onclick="fetchData()" title="Обновить">↻</button>
                    <button class="icon-btn" onclick="openModal()" title="Настройки">⚙</button>
                    <button class="btn-main">Скачать отчет</button>
                </div>
            </div>

            <!-- GRID -->
            <div class="dashboard-grid">
                
                <!-- 1. HERO -->
                <div class="card card-hero">
                    <div class="card-header">
                        <span class="card-title">TOTAL REVENUE</span>
                        <div class="badge badge-success" id="global-status">ON TRACK</div>
                    </div>
                    <div class="hero-stat" id="total-revenue">0 ₽</div>
                    <div class="flex-row text-sm" style="margin-top: auto; padding-top: 10px;">
                        <span>Target: <span id="total-target" class="text-mono">0</span></span>
                        <span id="revenue-percent" style="color: #fff; font-weight: 700;">0%</span>
                    </div>
                    <div class="progress-track" style="margin-top: 10px;">
                        <div class="progress-fill" id="revenue-bar"></div>
                    </div>
                </div>

                <!-- 2. SPLIT KPIs -->
                <div class="card card-kpi-1">
                    <div class="card-header"><span class="card-title">СРЕДНИЙ ЧЕК</span></div>
                    <div style="margin-top: auto; display: flex; flex-direction: column; height: 100%; justify-content: center;">
                        <div style="font-size: clamp(48px, 4vw, 64px); font-weight: 700; color: #fff; letter-spacing: -2px;" id="avg-check">0</div>
                        <div class="text-sm" style="font-size: 14px; color: var(--text-dark); margin-top: 5px;">Сделок: <span id="total-deals" style="color: #fff;">0</span></div>
                    </div>
                </div>

                <div class="card card-kpi-2" style="align-items: center; justify-content: center;">
                    <div class="card-header" style="width: 100%;"><span class="card-title">ЭФФЕКТИВНОСТЬ</span></div>
                    <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" id="efficiency-circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="percentage" id="efficiency-rate">0%</text>
                        </svg>
                    </div>
                    <div class="text-sm" style="margin-top: 10px; width: 100%; text-align: center;">В плане: <span id="managers-on-track" style="color: var(--success);">0</span></div>
                </div>

                <!-- 3. CHART -->
                <div class="card card-chart">
                    <div class="card-header">
                        <span class="card-title">KPI ДИНАМИКА</span>
                        <div style="display: flex; gap: 10px;">
                            <div class="text-sm" style="display: flex; align-items: center; gap: 4px;"><div style="width: 6px; height: 6px; background: var(--success); border-radius: 50%;"></div>OK</div>
                            <div class="text-sm" style="display: flex; align-items: center; gap: 4px;"><div style="width: 6px; height: 6px; background: var(--primary); border-radius: 50%;"></div>Work</div>
                        </div>
                    </div>
                    <div class="chart-container" id="chart-canvas">
                        <!-- Bars injected here -->
                    </div>
                </div>

                <!-- 4. LEADERBOARD LIST -->
                <div class="card card-list">
                    <div class="list-header">
                        <div class="flex-row">
                            <span class="card-title">РЕЙТИНГ ПРОДАЖ</span>
                            <span class="text-mono text-sm">TOP 15</span>
                        </div>
                    </div>
                    <div class="list-scroll" id="leaderboard-container">
                        <!-- JS Injected items -->
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>
    // --- ДВИЖЕНИЕ (PARALLAX) ---
    if (window.matchMedia("(min-width: 769px)").matches) {
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.card');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const deltaX = (e.clientX - centerX) / 150;
            const deltaY = (e.clientY - centerY) / 150;

            cards.forEach(card => {
                card.style.transform = `perspective(1000px) rotateY(${deltaX * 0.15}deg) rotateX(${-deltaY * 0.15}deg) translateZ(0)`;
            });
        });
    }

    // --- ГЕНЕРАЦИЯ ДАННЫХ (ФИКС) ---
    const generateDemoData = () => {
        return [
            { name: "Максим Л.", revenue: 2205000, target: 1500000, deals: 35 },
            { name: "Виктория С.", revenue: 2190000, target: 1500000, deals: 42 },
            { name: "Николай Р.", revenue: 2050000, target: 1500000, deals: 38 },
            { name: "Александр С.", revenue: 1750000, target: 1500000, deals: 30 },
            { name: "Татьяна Г.", revenue: 1550000, target: 1500000, deals: 28 },
            { name: "Юлия К.", revenue: 1320000, target: 1500000, deals: 25 },
            { name: "Ольга Н.", revenue: 1305000, target: 1500000, deals: 24 },
            { name: "Елена П.", revenue: 1100000, target: 1500000, deals: 20 },
            { name: "Иван Д.", revenue: 788100, target: 1500000, deals: 15 },
            { name: "Мария К.", revenue: 780100, target: 1500000, deals: 14 },
            { name: "Павел О.", revenue: 727500, target: 1500000, deals: 12 },
            { name: "Дмитрий В.", revenue: 668800, target: 1500000, deals: 10 },
            { name: "Анна Ф.", revenue: 613000, target: 1500000, deals: 9 },
            { name: "Андрей М.", revenue: 550000, target: 1500000, deals: 8 },
            { name: "Сергей Б.", revenue: 495000, target: 1500000, deals: 7 }
        ];
    };

    // --- УТИЛИТЫ ---
    const formatMoney = (n) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(n);
    const formatCompact = (n) => Intl.NumberFormat('en-US', { notation: "compact", maximumFractionDigits: 1 }).format(n);
    const getInitials = (n) => n.split(' ').map(c => c[0]).join('').substring(0,2).toUpperCase();

    // --- ANIMATION ENGINE ---
    const animateValue = (id, start, end, duration, formatter) => {
        const obj = document.getElementById(id);
        if(!obj) return;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeOutQuad = 1 - (1 - progress) * (1 - progress);
            const val = Math.floor(easeOutQuad * (end - start) + start);
            obj.innerText = formatter ? formatter(val) : val;
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    };

    // --- STATE ---
    let appData = [];

    function init() {
        fetchData();
    }

    // --- UI FUNCTIONS ---
    const modal = document.getElementById('settingsModal');
    window.openModal = () => {
        document.getElementById('sheetUrlInput').value = localStorage.getItem('dash_url') || '';
        modal.style.display = 'flex';
    };
    window.closeModal = () => modal.style.display = 'none';
    
    window.saveSettings = () => {
        const url = document.getElementById('sheetUrlInput').value.trim();
        if(url) localStorage.setItem('dash_url', url);
        closeModal();
        fetchData();
    };
    window.resetToDemo = () => {
        localStorage.removeItem('dash_url');
        closeModal();
        fetchData();
    };

    // --- DATA PARSING ---
    const parseCSV = (txt) => {
        const lines = txt.split('\n').filter(l => l.trim() !== '');
        return lines.slice(1).map(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if(!cols || cols.length < 4) return null;
            const clean = (val) => val ? val.replace(/['"₽$ ]/g, '').replace(',', '.') : '0';
            return {
                name: cols[0].replace(/['"]/g, '').trim(),
                revenue: parseFloat(clean(cols[1])) || 0,
                target: parseFloat(clean(cols[2])) || 0,
                deals: parseInt(clean(cols[3])) || 0
            };
        }).filter(x => x);
    };

    // --- FETCH & RENDER ---
    window.fetchData = async () => {
        const url = localStorage.getItem('dash_url');
        const btn = document.querySelector('.icon-btn'); 
        if(btn) btn.style.transform = "rotate(360deg)";

        try {
            if (url) {
                const res = await fetch(url);
                if(!res.ok) throw new Error("Fetch failed");
                const txt = await res.text();
                const parsed = parseCSV(txt);
                if (parsed.length) appData = parsed;
                else appData = generateDemoData();
            } else {
                appData = generateDemoData();
            }
        } catch (e) { 
            console.error("Error:", e);
            appData = generateDemoData(); 
        }
        
        setTimeout(() => {
            renderDashboard();
            if(btn) btn.style.transform = "rotate(0deg)";
        }, 100);
    };

    function renderDashboard() {
        const data = [...appData].sort((a,b) => b.revenue - a.revenue);
        
        const totalRev = data.reduce((a,b) => a + b.revenue, 0);
        const totalTarget = data.reduce((a,b) => a + b.target, 0);
        const totalDeals = data.reduce((a,b) => a + b.deals, 0);
        const avgCheck = totalDeals > 0 ? totalRev / totalDeals : 0;
        
        const percentGlobal = totalTarget ? (totalRev / totalTarget) * 100 : 0;
        const managersOnTrack = data.filter(d => d.revenue >= d.target).length;
        const efficiencyRate = Math.round((managersOnTrack / data.length) * 100);

        // 1. Total Revenue Animation
        animateValue("total-revenue", 0, totalRev, 1500, formatMoney);
        document.getElementById('total-target').innerText = formatMoney(totalTarget);
        
        const bar = document.getElementById('revenue-bar');
        bar.style.width = "0%"; 
        setTimeout(() => {
            bar.style.width = Math.min(percentGlobal, 100) + "%";
            bar.style.background = percentGlobal >= 100 ? 'var(--success)' : 'var(--primary)';
        }, 100);
        
        document.getElementById('revenue-percent').innerText = percentGlobal.toFixed(1) + "%";
        const statusEl = document.getElementById('global-status');
        statusEl.innerText = percentGlobal >= 100 ? "ВЫПОЛНЕН" : "В РАБОТЕ";
        statusEl.className = percentGlobal >= 100 ? "badge badge-success" : "badge badge-warn";

        // 2. Avg Check Animation
        animateValue("avg-check", 0, avgCheck, 1500, formatCompact); 
        document.getElementById('total-deals').innerText = totalDeals;

        // 3. Efficiency Donut
        document.getElementById('managers-on-track').innerText = `${managersOnTrack} / ${data.length}`;
        const circle = document.getElementById('efficiency-circle');
        circle.style.stroke = efficiencyRate >= 50 ? 'var(--success)' : 'var(--primary)';
        circle.setAttribute("stroke-dasharray", "0, 100"); 
        setTimeout(() => {
             circle.setAttribute("stroke-dasharray", `${efficiencyRate}, 100`);
             document.getElementById('efficiency-rate').innerText = efficiencyRate + "%";
        }, 300);

        // 4. List
        const listContainer = document.getElementById('leaderboard-container');
        listContainer.innerHTML = '';
        data.forEach((item, idx) => {
            const p = (item.revenue / item.target) * 100;
            const rankClass = idx < 3 ? `rank-${idx+1}` : '';
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="rank-badge ${rankClass}" style="${!rankClass ? 'background:none; color:#555;' : ''}">${idx+1}</div>
                <div style="flex: 1; margin-left: 8px;">
                    <div class="flex-row">
                        <span style="font-size: 13px; font-weight: 500; color: #fff;">${item.name}</span>
                        <span class="text-mono" style="font-size: 11px; color: ${p>=100 ? 'var(--success)' : 'var(--primary)'};">${formatCompact(item.revenue)}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                        <div style="flex: 1; height: 3px; background: #333; border-radius: 2px; overflow: hidden;">
                            <div style="height: 100%; width: ${Math.min(p, 100)}%; background: ${p>=100 ? 'var(--success)' : '#555'};"></div>
                        </div>
                        <span class="text-mono text-sm" style="width: 28px; text-align: right; opacity: 0.7;">${p.toFixed(0)}%</span>
                    </div>
                </div>
            `;
            listContainer.appendChild(div);
        });

        // 5. Chart
        const chartBox = document.getElementById('chart-canvas');
        chartBox.innerHTML = '';
        const maxVal = Math.max(...data.map(d => Math.max(d.revenue, d.target))) * 1.05;

        data.forEach((item, index) => {
            const h = (item.revenue / maxVal) * 100;
            const isSuccess = item.revenue >= item.target;
            const color = isSuccess ? 'var(--success)' : 'var(--primary)';
            
            const col = document.createElement('div');
            col.className = 'chart-col';
            const tooltip = `${item.name}: ${formatCompact(item.revenue)}`;
            
            col.innerHTML = `
                <div class="chart-bar" style="height: 0%; color: ${color}; transition-delay: ${index * 0.05}s;" data-tooltip="${tooltip}"></div>
                <div style="margin-top: 8px; font-size: 9px; color: #555; font-family: var(--font-mono);">${getInitials(item.name)}</div>
            `;
            chartBox.appendChild(col);
            
            setTimeout(() => {
                col.querySelector('.chart-bar').style.height = h + "%";
            }, 100);
        });

        const now = new Date();
        document.getElementById('last-update').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    init();

</script>
</body>
</html>
